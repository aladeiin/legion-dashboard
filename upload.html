<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Legion CRE — Upload Media</title>
<style>
:root{
  --navy:#1B3A6B;--navy-dark:#122848;--gold:#C9973A;
  --white:#fff;--bg:#F5F7FA;--bg2:#EDF1F7;
  --border:#DDE3EE;--border2:#C8D0E0;
  --text:#1A202C;--text2:#4A5568;--text3:#718096;
  --avail:#1A6B3A;--avail-bg:#E8F5EE;
  --danger:#9B2335;--danger-bg:#FCEEF0;
  --shadow:0 2px 8px rgba(27,58,107,.1);
  --shadow-md:0 4px 20px rgba(27,58,107,.14);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);min-height:100vh;padding-bottom:40px}
input,select,button,textarea{font-family:inherit;outline:none}

/* TOPBAR */
.topbar{background:var(--navy);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(27,58,107,.3)}
.topbar img{height:32px;object-fit:contain}
.topbar-title{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);border-left:1px solid rgba(255,255,255,.2);padding-left:12px}

/* CONTAINER */
.container{padding:16px;max-width:480px;margin:0 auto}

/* STEP INDICATOR */
.steps{display:flex;align-items:center;margin-bottom:20px;gap:0}
.step{flex:1;text-align:center;position:relative}
.step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:0 auto 4px;border:2px solid var(--border);background:var(--white);color:var(--text3);transition:.2s}
.step.active .step-num{background:var(--navy);border-color:var(--navy);color:#fff}
.step.done .step-num{background:var(--avail);border-color:var(--avail);color:#fff}
.step-label{font-size:10px;color:var(--text3);font-weight:500}
.step.active .step-label{color:var(--navy);font-weight:600}
.step-line{flex:0 0 32px;height:2px;background:var(--border);margin-top:-18px;align-self:flex-start;transition:.2s}
.step-line.done{background:var(--avail)}

/* CARD */
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-title{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card-title-icon{width:22px;height:22px;background:var(--bg2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}

/* SEARCH */
.search-wrap{position:relative}
.search-wrap input{width:100%;padding:10px 12px 10px 36px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);transition:.15s}
.search-wrap input:focus{border-color:var(--navy);background:var(--white)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text3);pointer-events:none}
.dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--white);border:1.5px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);z-index:50;max-height:220px;overflow-y:auto;display:none}
.dropdown.open{display:block}
.dropdown::-webkit-scrollbar{width:4px}
.dropdown::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.dd-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:.1s}
.dd-item:last-child{border-bottom:none}
.dd-item:hover,.dd-item.highlighted{background:var(--bg2)}
.dd-name{font-size:12px;font-weight:500;color:var(--text)}
.dd-meta{font-size:10px;color:var(--text3);margin-top:1px}

/* SELECTED PROPERTY */
.selected-prop{background:var(--bg2);border:1.5px solid var(--navy);border-radius:8px;padding:10px 12px;display:none;align-items:center;gap:10px;margin-top:8px}
.selected-prop.show{display:flex}
.sp-icon{width:32px;height:32px;background:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sp-info{flex:1}
.sp-name{font-size:12px;font-weight:600;color:var(--navy)}
.sp-meta{font-size:10px;color:var(--text3);margin-top:1px}
.sp-clear{background:none;border:none;color:var(--text3);font-size:16px;padding:4px;line-height:1}
.sp-clear:hover{color:var(--danger)}

/* MEDIA TYPE */
.type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.type-btn{padding:10px 6px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;transition:.15s}
.type-btn:hover{border-color:var(--border2)}
.type-btn.active{border-color:var(--navy);background:#EEF3FB}
.type-icon{font-size:20px;display:block;margin-bottom:4px}
.type-label{font-size:11px;font-weight:500;color:var(--text2)}
.type-btn.active .type-label{color:var(--navy);font-weight:600}

/* DROP ZONE */
.drop-zone{border:2px dashed var(--border2);border-radius:10px;padding:28px 16px;text-align:center;margin-top:12px;cursor:pointer;transition:.15s;background:var(--bg)}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--navy);background:#EEF3FB}
.drop-zone input{display:none}
.dz-icon{font-size:32px;display:block;margin-bottom:8px}
.dz-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.dz-sub{font-size:11px;color:var(--text3)}
.dz-btn{display:inline-block;margin-top:10px;background:var(--white);border:1.5px solid var(--border);border-radius:7px;padding:7px 16px;font-size:12px;font-weight:500;color:var(--text2)}

/* PREVIEWS */
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.preview-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.preview-item img,.preview-item video{width:100%;height:100%;object-fit:cover}
.preview-remove{position:absolute;top:4px;right:4px;width:20px;height:20px;background:rgba(0,0,0,.6);border:none;border-radius:50%;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.preview-item .file-name{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdf-thumb{width:100%;height:100%;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px}
.pdf-thumb span{font-size:9px;color:var(--text3);margin-top:3px}

/* UPLOAD BTN */
.upload-btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;margin-top:4px}
.upload-btn:hover:not(:disabled){background:var(--navy-dark)}
.upload-btn:disabled{opacity:.5;cursor:not-allowed}

/* PROGRESS */
.progress-wrap{margin-top:12px;display:none}
.progress-label{font-size:11px;color:var(--text2);margin-bottom:6px;display:flex;justify-content:space-between}
.progress-bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--navy);border-radius:3px;transition:width .3s;width:0%}

/* RESULTS */
.results{margin-top:14px;display:none}
.result-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.result-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.result-info{flex:1;min-width:0}
.result-name{font-size:11px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-status{font-size:10px;margin-top:2px}
.result-ok{color:var(--avail)}
.result-err{color:var(--danger)}
.result-icon{font-size:16px;flex-shrink:0}

/* SUCCESS BANNER */
.success-banner{background:var(--avail-bg);border:1.5px solid #A3D9B8;border-radius:10px;padding:14px 16px;text-align:center;display:none;margin-top:12px}
.sb-icon{font-size:28px;display:block;margin-bottom:6px}
.sb-title{font-size:14px;font-weight:600;color:var(--avail);margin-bottom:3px}
.sb-sub{font-size:11px;color:var(--text2)}
.sb-again{margin-top:12px;padding:8px 20px;background:var(--white);border:1.5px solid var(--border);border-radius:7px;font-size:12px;color:var(--text2);cursor:pointer}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 20px;border-radius:8px;font-size:12px;z-index:9000;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-md)}
.toast.show{opacity:1}
.toast.error{background:var(--danger)}
</style>
</head>

<div class="container">

  <!-- STEPS -->
  <div class="steps">

    <div class="step-line" id="sl1"></div>
    <div class="step" id="st2"><div class="step-num">2</div><div class="step-label">Media</div></div>
    <div class="step-line" id="sl2"></div>
    <div class="step" id="st3"><div class="step-num">3</div><div class="step-label">Upload</div></div>
  </div>

  <!-- STEP 1: SELECT PROPERTY -->
  <div id="step1">
    <div class="card">
      <div class="card-title"><span class="card-title-icon">🏢</span> Select Property</div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="prop-search" placeholder="Search by name or property code..." autocomplete="off" oninput="searchProps()" onfocus="showDropdown()"/>
        <div class="dropdown" id="prop-dropdown"></div>
      </div>
      <div class="selected-prop" id="selected-prop">
        <div class="sp-icon">📍</div>
        <div class="sp-info">
          <div class="sp-name" id="sp-name"></div>
          <div class="sp-meta" id="sp-meta"></div>
        </div>
        <button class="sp-clear" onclick="clearProp()">✕</button>
      </div>
    </div>
    <button class="upload-btn" id="next1-btn" onclick="goToStep2()" disabled>Continue →</button>
  </div>

  <!-- STEP 2: MEDIA TYPE + FILES -->
  <div id="step2" style="display:none">
    <div class="card">
      <div class="card-title"><span class="card-title-icon">📂</span> Media Type</div>
      <div class="type-grid">
        <div class="type-btn active" onclick="setType('photo',this)">
          <span class="type-icon">📷</span>
          <span class="type-label">Photos</span>
        </div>
        <div class="type-btn" onclick="setType('video',this)">
          <span class="type-icon">🎬</span>
          <span class="type-label">Video</span>
        </div>
        <div class="type-btn" onclick="setType('floorplan',this)">
          <span class="type-icon">📐</span>
          <span class="type-label">Floor Plan</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="card-title-icon">📎</span> Attach Files</div>
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()"
           ondragover="event.preventDefault();this.classList.add('drag-over')"
           ondragleave="this.classList.remove('drag-over')"
           ondrop="handleDrop(event)">
        <input type="file" id="file-input" multiple accept="image/*,video/*,.pdf" onchange="handleFiles(this.files)"/>
        <span class="dz-icon" id="dz-icon">📷</span>
        <div class="dz-title" id="dz-title">Tap to add photos</div>
        <div class="dz-sub" id="dz-sub">JPG, PNG, HEIC · multiple files supported</div>
        <div class="dz-btn">Choose from camera roll</div>
      </div>
      <div class="preview-grid" id="preview-grid"></div>
    </div>

    <div style="display:flex;gap:8px">
      <button class="upload-btn" style="background:var(--bg);color:var(--text2);border:1.5px solid var(--border);flex:0 0 auto;width:auto;padding:13px 18px" onclick="goToStep1()">← Back</button>
      <button class="upload-btn" id="upload-btn" onclick="startUpload()" disabled>Upload Files</button>
    </div>

    <!-- PROGRESS -->
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-label"><span id="prog-label">Uploading…</span><span id="prog-pct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <!-- RESULTS -->
    <div class="results" id="results"></div>

    <!-- SUCCESS -->
    <div class="success-banner" id="success-banner">
      <span class="sb-icon">✅</span>
      <div class="sb-title">Upload Complete!</div>
      <div class="sb-sub" id="sb-sub">Files saved to Google Drive</div>
      <button class="sb-again" onclick="resetAll()">Upload More</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

let selectedProp = null;
let mediaType = "photo";
let filesToUpload = [];

// ── SEARCH ───────────────────────────────────────────
function searchProps() {
  const q = document.getElementById("prop-search").value.toLowerCase().trim();
  const dd = document.getElementById("prop-dropdown");
  if (!q) { dd.classList.remove("open"); return; }
  const matches = PROPERTIES.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.code.toLowerCase().includes(q) ||
    p.market.toLowerCase().includes(q)
  ).slice(0, 30);
  if (!matches.length) { dd.innerHTML = '<div class="dd-item"><div class="dd-name" style="color:var(--text3)">No results found</div></div>'; dd.classList.add("open"); return; }
  dd.innerHTML = matches.map(p => `
    <div class="dd-item" onclick="selectProp(${JSON.stringify(p).replace(/"/g,'&quot;')})">
      <div class="dd-name">${p.name}</div>
      <div class="dd-meta">${p.code} · ${p.market}</div>
    </div>`).join("");
  dd.classList.add("open");
}

function showDropdown() {
  if (document.getElementById("prop-search").value.trim()) searchProps();
}

document.addEventListener("click", e => {
  if (!e.target.closest(".search-wrap")) {
    document.getElementById("prop-dropdown").classList.remove("open");
  }
});

function selectProp(p) {
  selectedProp = p;
  document.getElementById("prop-search").value = p.name;
  document.getElementById("prop-dropdown").classList.remove("open");
  document.getElementById("sp-name").textContent = p.name;
  document.getElementById("sp-meta").textContent = p.code + " · " + p.market;
  document.getElementById("selected-prop").classList.add("show");
  document.getElementById("next1-btn").disabled = false;
}

function clearProp() {
  selectedProp = null;
  document.getElementById("prop-search").value = "";
  document.getElementById("selected-prop").classList.remove("show");
  document.getElementById("next1-btn").disabled = true;
}

// ── STEPS ─────────────────────────────────────────────
function goToStep2() {
  if (!selectedProp) return;
  document.getElementById("step1").style.display = "none";
  document.getElementById("step2").style.display = "block";
  setStepState(2);
}

function goToStep1() {
  document.getElementById("step2").style.display = "none";
  document.getElementById("step1").style.display = "block";
  setStepState(1);
}

function setStepState(active) {
  [1,2,3].forEach(i => {
    const el = document.getElementById("st"+i);
    el.classList.remove("active","done");
    if (i < active) el.classList.add("done");
    else if (i === active) el.classList.add("active");
  });
  [1,2].forEach(i => {
    const el = document.getElementById("sl"+i);
    el.classList.toggle("done", i < active);
  });
}

// ── MEDIA TYPE ─────────────────────────────────────────
function setType(type, el) {
  mediaType = type;
  document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  filesToUpload = [];
  document.getElementById("preview-grid").innerHTML = "";
  document.getElementById("upload-btn").disabled = true;
  const icons = {photo:"📷",video:"🎬",floorplan:"📄"};
  const titles = {photo:"Tap to add photos",video:"Tap to add video",floorplan:"Tap to add floor plan (PDF/Image)"};
  const subs = {photo:"JPG, PNG, HEIC · multiple files",video:"MP4, MOV · one file",floorplan:"PDF, JPG, PNG"};
  document.getElementById("dz-icon").textContent = icons[type];
  document.getElementById("dz-title").textContent = titles[type];
  document.getElementById("dz-sub").textContent = subs[type];
  document.getElementById("file-input").accept = type==="video" ? "video/*" : type==="floorplan" ? ".pdf,image/*" : "image/*";
  document.getElementById("file-input").multiple = type !== "video";
}

// ── FILES ──────────────────────────────────────────────
function handleDrop(e) {
  e.preventDefault();
  document.getElementById("drop-zone").classList.remove("drag-over");
  handleFiles(e.dataTransfer.files);
}

function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!filesToUpload.find(f => f.name === file.name && f.size === file.size)) {
      filesToUpload.push(file);
    }
  });
  renderPreviews();
  document.getElementById("upload-btn").disabled = filesToUpload.length === 0;
  document.getElementById("upload-btn").textContent = filesToUpload.length > 0
    ? "Upload " + filesToUpload.length + " file" + (filesToUpload.length>1?"s":"")
    : "Upload Files";
}

function renderPreviews() {
  const grid = document.getElementById("preview-grid");
  grid.innerHTML = filesToUpload.map((f,i) => {
    const url = URL.createObjectURL(f);
    let thumb = "";
    if (f.type.startsWith("image/")) {
      thumb = `<img src="${url}" alt=""/>`;
    } else if (f.type.startsWith("video/")) {
      thumb = `<video src="${url}" muted></video>`;
    } else {
      thumb = `<div class="pdf-thumb">📄<span>PDF</span></div>`;
    }
    return `<div class="preview-item">
      ${thumb}
      <button class="preview-remove" onclick="removeFile(${i})">✕</button>
      <div class="file-name">${f.name}</div>
    </div>`;
  }).join("");
}

function removeFile(i) {
  filesToUpload.splice(i, 1);
  renderPreviews();
  const btn = document.getElementById("upload-btn");
  btn.disabled = filesToUpload.length === 0;
  btn.textContent = filesToUpload.length > 0
    ? "Upload " + filesToUpload.length + " file" + (filesToUpload.length>1?"s":"")
    : "Upload Files";
}

// ── UPLOAD ─────────────────────────────────────────────
async function startUpload() {
  if (!selectedProp || filesToUpload.length === 0) return;

  setStepState(3);
  document.getElementById("upload-btn").disabled = true;
  document.getElementById("progress-wrap").style.display = "block";
  document.getElementById("results").style.display = "block";
  document.getElementById("results").innerHTML = "";

  let done = 0;
  const total = filesToUpload.length;

  for (let i = 0; i < filesToUpload.length; i++) {
    const file = filesToUpload[i];
    updateProgress(i, total, "Uploading " + file.name + "…");

    try {
      const b64 = await toBase64(file);
      const payload = {
        propertyCode: selectedProp.code,
        propertyName: selectedProp.name,
        mediaType: mediaType,
        fileName: mediaType + "_" + Date.now() + "_" + file.name,
        mimeType: file.type || "application/octet-stream",
        fileData: b64,
      };

      const res = await fetch(API, {
        method: "POST",
        body: JSON.stringify(payload),
      });
      const json = await res.json();

      if (json.success) {
        done++;
        addResult(file.name, true, json.thumbUrl);
      } else {
        addResult(file.name, false, null, json.error);
      }
    } catch (err) {
      addResult(file.name, false, null, err.message);
    }
  }

  updateProgress(total, total, "Done!");
  document.getElementById("success-banner").style.display = "block";
  document.getElementById("sb-sub").textContent =
    done + " of " + total + " file" + (total>1?"s":"") + " saved to Google Drive under " + selectedProp.code;
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function updateProgress(done, total, label) {
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("prog-pct").textContent = pct + "%";
  document.getElementById("prog-label").textContent = label;
}

function addResult(name, ok, thumbUrl, err) {
  const div = document.createElement("div");
  div.className = "result-item";
  div.innerHTML = thumbUrl
    ? `<img class="result-thumb" src="${thumbUrl}" onerror="this.style.display='none'" alt=""/>`
    : `<div class="result-thumb" style="background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:18px">${ok?"📄":"❌"}</div>`;
  div.innerHTML += `
    <div class="result-info">
      <div class="result-name">${name}</div>
      <div class="result-status ${ok?"result-ok":"result-err"}">${ok?"✓ Saved to Drive":"✗ " + (err||"Failed")}</div>
    </div>
    <span class="result-icon">${ok?"✅":"❌"}</span>`;
  document.getElementById("results").appendChild(div);
}

function resetAll() {
  selectedProp = null;
  filesToUpload = [];
  mediaType = "photo";
  document.getElementById("prop-search").value = "";
  document.getElementById("selected-prop").classList.remove("show");
  document.getElementById("next1-btn").disabled = true;
  document.getElementById("preview-grid").innerHTML = "";
  document.getElementById("progress-wrap").style.display = "none";
  document.getElementById("results").style.display = "none";
  document.getElementById("success-banner").style.display = "none";
  document.getElementById("results").innerHTML = "";
  document.querySelectorAll(".type-btn").forEach((b,i) => { b.classList.toggle("active", i===0); });
  goToStep1();
}

function showToast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (err?" error":"") + " show";
  setTimeout(() => t.className = "toast", 2500);
}
</script>
